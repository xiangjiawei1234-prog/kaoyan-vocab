<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>完形填空固定搭配 · 记忆卡片</title>
<meta name="description" content="考研英语完形填空固定搭配记忆卡片，166 条真题搭配，卡片式背诵、错题本、本地进度。">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>完形填空固定搭配</h1>
    <p class="sub">考研英语一 / 二 / 旧卷真题 · 166 条固定搭配 · 卡片记忆</p>
  </header>

  <div class="stats" aria-live="polite">
    <div class="stat" id="statRound">本轮进度<b>0 / 0</b></div>
    <div class="stat" id="statRate">认识率<b>0%</b></div>
    <div class="stat" id="statWrong">错题本<b>0</b></div>
    <div class="stat" id="statKnown">已掌握<b>0 / 166</b></div>
  </div>

  <section class="controls" aria-label="筛选与设置">
    <div class="ctl-row">
      <span class="ctl-label">范围</span>
      <div class="chips" id="scopeChips"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">类型</span>
      <div class="chips" id="catChips"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">次数</span>
      <div class="chips" id="countChips"></div>
    </div>
    <div class="ctl-row">
      <label class="switch"><input type="checkbox" id="shuffleInput"> 乱序</label>
      <label class="switch"><input type="checkbox" id="clozeInput"> 正面例句挖空</label>
      <span class="chip" id="seedLabel" style="cursor:default">seed —</span>
      <button type="button" class="btn-ghost" id="btnRebuild">按 seed 重排</button>
      <button type="button" class="btn-ghost" id="btnReseed">换 seed</button>
    </div>
  </section>

  <div class="stage" id="stage">
    <div class="card-outer" id="card" role="button" tabindex="0" aria-label="点击翻卡">
      <div class="card" id="cardInner">
        <div class="face front" id="faceFront"></div>
        <div class="face back" id="faceBack"></div>
      </div>
    </div>
  </div>

  <div class="actions" id="actions">
    <button type="button" class="act no" id="btnNo" title="快捷键 J 或 1">不认识</button>
    <button type="button" class="act yes" id="btnYes" title="快捷键 K 或 2">认识</button>
  </div>

  <div class="nav-row" id="nav">
    <button type="button" class="btn-ghost" id="btnPrev">← 上一张</button>
    <button type="button" class="btn-ghost" id="btnNext">下一张 →</button>
  </div>

  <div class="empty" id="empty" hidden>
    <h2>没有匹配的卡片</h2>
    <p>当前筛选条件下没有卡片。</p>
  </div>

  <p class="tip">
    <kbd>空格</kbd> 翻卡 ·
    <kbd>J</kbd>/<kbd>1</kbd> 不认识 ·
    <kbd>K</kbd>/<kbd>2</kbd> 认识 ·
    <kbd>←</kbd><kbd>→</kbd> 切换 ·
    进度存在本机浏览器
  </p>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
